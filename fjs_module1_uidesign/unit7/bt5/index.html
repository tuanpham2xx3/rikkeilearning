<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit 7 - BT5 | Lưới Danh Mục Tour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-50 text-slate-900 font-sans">
    <main class="min-h-screen">
      <section class="py-12 sm:py-16">
        <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
          <header class="text-center">
            <h2 class="text-2xl sm:text-3xl font-bold tracking-tight">Các Tour Nổi Bật</h2>
          </header>

          <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8">
            <article class="bg-white rounded-2xl shadow-sm ring-1 ring-black/5 overflow-hidden hover:shadow-md transition-shadow">
              <div class="aspect-[16/9] overflow-hidden bg-slate-100">
                <img
                  src="../image.png"
                  alt="Thái Lan"
                  class="h-full w-full object-cover"
                  loading="lazy"
                />
              </div>
              <div class="p-6 text-center">
                <h3 class="font-semibold text-lg">Thái Lan</h3>
                <p class="mt-1 text-sm text-slate-500">Xứ sở chùa vàng</p>
              </div>
            </article>

            <article class="bg-white rounded-2xl shadow-sm ring-1 ring-black/5 overflow-hidden hover:shadow-md transition-shadow">
              <div class="aspect-[16/9] overflow-hidden bg-slate-100">
                <img
                  src="../image.png"
                  alt="Nhật Bản"
                  class="h-full w-full object-cover"
                  loading="lazy"
                />
              </div>
              <div class="p-6 text-center">
                <h3 class="font-semibold text-lg">Nhật Bản</h3>
                <p class="mt-1 text-sm text-slate-500">Hoa anh đào rực rỡ</p>
              </div>
            </article>

            <article class="bg-white rounded-2xl shadow-sm ring-1 ring-black/5 overflow-hidden hover:shadow-md transition-shadow">
              <div class="aspect-[16/9] overflow-hidden bg-slate-100">
                <img
                  src="../image.png"
                  alt="Pháp"
                  class="h-full w-full object-cover"
                  loading="lazy"
                />
              </div>
              <div class="p-6 text-center">
                <h3 class="font-semibold text-lg">Pháp</h3>
                <p class="mt-1 text-sm text-slate-500">Kinh đô ánh sáng</p>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
