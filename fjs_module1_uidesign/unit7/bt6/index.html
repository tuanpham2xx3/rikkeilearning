<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit 7 - BT6 | Form Tìm Kiếm Chuyến Đi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
          },
        },
      };
    </script>
  </head>

  <body class="bg-slate-50 text-slate-900 font-sans">
    <main class="min-h-screen py-12 sm:py-16">
      <section class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8">
        <div class="rounded-2xl bg-white shadow-sm ring-1 ring-black/5 p-4 sm:p-6 lg:p-7">
          <form class="flex flex-col md:flex-row md:items-end gap-4 md:gap-5">
            <div class="w-full md:flex-1">
              <label for="destination" class="block text-sm font-semibold text-slate-700">Điểm đến</label>
              <input
                id="destination"
                name="destination"
                type="text"
                placeholder="Bạn muốn đi đâu?"
                class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-4 py-3 text-base outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15"
              />
            </div>

            <div class="w-full md:flex-1">
              <label for="departureDate" class="block text-sm font-semibold text-slate-700">Ngày đi</label>
              <input
                id="departureDate"
                name="departureDate"
                type="date"
                class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-4 py-3 text-base outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15"
              />
            </div>

            <button
              type="submit"
              class="w-full md:w-auto rounded-lg bg-blue-600 px-7 py-3 text-base font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-600/20"
            >
              Tìm kiếm
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
