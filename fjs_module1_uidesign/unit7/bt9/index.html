<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit 7 - BT9 | Lưới Dịch Vụ Tái Sử Dụng</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
          },
        },
      };
    </script>

    <style type="text/tailwindcss">
      @layer components {
        .page {
          @apply bg-slate-50 text-slate-900 font-sans;
        }

        .container {
          @apply mx-auto max-w-6xl px-4 sm:px-6 lg:px-8;
        }

        .section {
          @apply py-12 sm:py-16;
        }

        .section__title {
          @apply text-center text-2xl sm:text-3xl font-bold tracking-tight;
        }

        .services-grid {
          @apply mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-8;
        }

        .service-card {
          @apply rounded-2xl bg-white shadow-sm ring-1 ring-black/5 p-6 transition-shadow hover:shadow-md;
        }

        .service-card__head {
          @apply flex items-start gap-4;
        }

        .service-card__icon {
          @apply grid h-11 w-11 shrink-0 aspect-square place-items-center rounded-md bg-blue-50 text-blue-700 ring-1 ring-blue-100;
        }

        .service-card__title {
          @apply mt-0.5 text-base font-semibold;
        }

        .service-card__desc {
          @apply mt-2 text-sm leading-relaxed text-slate-500;
        }
      }
    </style>
  </head>

  <body class="page">
    <main class="min-h-screen">
      <section class="section">
        <div class="container">
          <header>
            <h2 class="section__title">Dịch Vụ Đi Kèm</h2>
          </header>

          <div class="services-grid">
            <article class="service-card">
              <div class="service-card__head">
                <div class="service-card__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" stroke="currentColor" stroke-width="2">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9.5z"
                    />
                  </svg>
                </div>
                <div>
                  <h3 class="service-card__title">Khách Sạn</h3>
                  <p class="service-card__desc">Hệ thống khách sạn chuẩn quốc tế cao cấp và tiện nghi.</p>
                </div>
              </div>
            </article>

            <article class="service-card">
              <div class="service-card__head">
                <div class="service-card__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" stroke="currentColor" stroke-width="2">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M4 16l8.5-8.5a2.5 2.5 0 0 1 3.5 0L20 11"
                    />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 19h18" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 19v-3" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 19v-3" />
                  </svg>
                </div>
                <div>
                  <h3 class="service-card__title">Vé Máy Bay</h3>
                  <p class="service-card__desc">Đối tác từ các hãng hàng không hàng đầu thế giới.</p>
                </div>
              </div>
            </article>

            <article class="service-card">
              <div class="service-card__head">
                <div class="service-card__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" stroke="currentColor" stroke-width="2">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 3l7 4v6c0 5-3.5 8.5-7 9-3.5-.5-7-4-7-9V7l7-4z"
                    />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.5 12l1.8 1.8L14.8 10" />
                  </svg>
                </div>
                <div>
                  <h3 class="service-card__title">Bảo Hiểm</h3>
                  <p class="service-card__desc">Đảm bảo an toàn 100% trong mọi tình huống khẩn cấp.</p>
                </div>
              </div>
            </article>

            <article class="service-card">
              <div class="service-card__head">
                <div class="service-card__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5" stroke="currentColor" stroke-width="2">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M8 11a4 4 0 1 1 8 0v5a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-5z"
                    />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 20h12" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 9V7a3 3 0 0 1 6 0v2" />
                  </svg>
                </div>
                <div>
                  <h3 class="service-card__title">Hướng Dẫn</h3>
                  <p class="service-card__desc">Đội ngũ hướng dẫn viên người bản địa giàu kinh nghiệm.</p>
                </div>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
