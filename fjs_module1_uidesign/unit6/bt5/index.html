<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm border border-1 rounded-4">
            <div class="card-body p-4 p-md-5">
              <h2 class="text-center fw-bold mb-4">Thêm Sách Mới</h2>

              <form>
                <div class="mb-3">
                  <label for="bookName" class="form-label fw-semibold"
                    >Tên sách</label
                  >
                  <input
                    id="bookName"
                    type="text"
                    class="form-control form-control-lg rounded-3"
                    placeholder="Nhập tên sách..."
                  />
                </div>

                <div class="mb-3">
                  <label for="authorName" class="form-label fw-semibold"
                    >Tác giả</label
                  >
                  <input
                    id="authorName"
                    type="text"
                    class="form-control form-control-lg rounded-3"
                    placeholder="Nhập tên tác giả..."
                  />
                </div>

                <div class="mb-4">
                  <label for="category" class="form-label fw-semibold"
                    >Thể loại</label
                  >
                  <select
                    id="category"
                    class="form-select form-select-lg rounded-3"
                  >
                    <option value="" selected disabled>Chọn thể loại...</option>
                    <option value="van-hoc">Văn học</option>
                    <option value="kinh-te">Kinh tế</option>
                    <option value="ky-nang">Kỹ năng</option>
                    <option value="thieu-nhi">Thiếu nhi</option>
                  </select>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                  Thêm sách
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
