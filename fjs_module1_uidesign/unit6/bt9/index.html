<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">
          <div class="card event-card rounded-4">
            <div class="row g-0">
              <div class="col-12 col-md-5 event-media">
                <img
                  src="../image.png"
                  alt="Tech Talk audience"
                />
              </div>

              <div class="col-12 col-md-7">
                <div class="card-body p-4 p-md-5">
                  <h1 class="h3 fw-bold mb-3 text-primary">
                    Tech Talk: Tương Lai Lập Trình AI
                  </h1>

                  <p class="text-secondary-emphasis mb-4">
                    Tham gia cùng Rikkei Academy để khám phá những xu hướng công
                    nghệ AI mới nhất và cách ứng dụng vào phát triển phần mềm
                    trong tương lai.
                  </p>

                  <div class="mb-4">
                    <div class="fw-semibold">Thời gian:</div>
                    <div class="text-body-secondary">
                      09:00 - 12:00, 25/11/2026
                    </div>
                  </div>
                  <div class="mb-4">
                    <div class="fw-semibold">Địa điểm:</div>
                    <div class="text-body-secondary">
                      Cơ sở Rikkei Academy HN
                    </div>
                  </div>
                  <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-primary px-4" href="#" role="button">
                      Đăng Ký Ngay
                    </a>
                    <a
                      class="btn btn-outline-secondary px-4"
                      href="#"
                      role="button"
                    >
                      Xem Chi Tiết
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
