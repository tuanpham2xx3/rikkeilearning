<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="container table-wrap">
        <h1 class="h4 text-center text-dark mb-3">
          Danh Sách Sách Kèm Trạng Thái Xóa
        </h1>

        <div class="table-responsive shadow-sm">
          <table class="table table-dark-head table-hover align-middle mb-0">
            <thead>
              <tr>
                <th scope="col" style="width: 80px">ID</th>
                <th scope="col">Tên Sách</th>
                <th scope="col">Tác Giả</th>
                <th scope="col" class="text-end" style="width: 160px">
                  Thao tác
                </th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">1</th>
                <td>Hành Trình Về Phương Đông</td>
                <td>Baird T. Spalding</td>
                <td class="text-end">
                  <button
                    type="button"
                    class="btn btn-danger btn-delete"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteConfirmModal"
                  >
                    Xóa
                  </button>
                </td>
              </tr>
              <tr>
                <th scope="row">2</th>
                <td>Đắc Nhân Tâm</td>
                <td>Dale Carnegie</td>
                <td class="text-end">
                  <button
                    type="button"
                    class="btn btn-danger btn-delete"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteConfirmModal"
                  >
                    Xóa
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="deleteConfirmModal"
      tabindex="-1"
      aria-labelledby="deleteConfirmModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1
              class="modal-title fs-6 modal-title-danger"
              id="deleteConfirmModalLabel"
            >
              Xác nhận xóa
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Đóng"
            ></button>
          </div>
          <div class="modal-body">
            Bạn có chắc chắn muốn xóa cuốn sách này không? Hành động này không
            thể hoàn tác.
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
            <button
              type="button"
              class="btn btn-danger"
              data-bs-dismiss="modal"
            >
              Xác nhận
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
